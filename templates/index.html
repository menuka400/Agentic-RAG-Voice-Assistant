<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Voice Assistant</title>
  <meta name="description" content="AI-powered voice assistant with real-time speech and text chat." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
</head>
<body>
  <!-- Ambient background -->
  <div class="ambient-bg">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div class="app-container" id="main-card">
    <!-- 1. TOP BAR -->
    <header class="top-bar">
      <div class="app-name">AI Assistant</div>
      <div class="model-badge">llama-3.3-70b-versatile</div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Online</span>
      </div>
      <!-- Hidden close-btn just for existing JS ref -->
      <button class="close-btn" id="close-btn" aria-label="Close" style="display:none;"></button>
    </header>

    <!-- 2. WAVEFORM SECTION -->
    <section class="waveform-section">
      <canvas id="waveform-canvas" class="waveform-canvas" aria-label="Audio waveform visualizer"></canvas>
      <p class="waveform-status" id="waveform-status">Tap the mic to speak…</p>
    </section>

    <!-- 3. CONTROL BUTTONS ROW -->
    <section class="controls-row">
      <button id="interrupt-btn" class="control-pill btn-interrupt" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon"><path d="M6 6h12v12H6z"/></svg>
        <span>Interrupt</span>
      </button>
      <button id="mute-btn" class="control-pill btn-mute">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon icon-unmuted"><path d="M12 4L7 9H3v6h4l5 5V4zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon icon-muted" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        <span class="mute-label">Mute</span>
      </button>
      <button id="hold-btn" class="control-pill btn-hold" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        <span>Hold</span>
      </button>
    </section>

    <!-- 4. MIC BUTTON -->
    <section class="mic-section">
      <button id="mic-btn" class="mic-btn" aria-label="Record voice" title="Click to record">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4z"/>
          <path d="M19 10a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V19H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 10z"/>
        </svg>
      </button>
    </section>

    <!-- 5. CHAT MESSAGES AREA -->
    <main class="chat-messages" id="chat-messages" role="log" aria-live="polite">
      <div class="message bot">
        <div class="bubble">
          👋 Hello! How can I help you today?
        </div>
      </div>
    </main>

    <!-- 6. INPUT BAR -->
    <footer class="chat-input-bar">
      <textarea id="user-input" class="chat-input" placeholder="Type a message…" rows="1" aria-label="Message input"></textarea>
      <button id="send-btn" class="send-btn" aria-label="Send message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
        </svg>
      </button>
    </footer>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
  <script src="{{ url_for('static', path='js/chat.js') }}"></script>
</body>
</html>
