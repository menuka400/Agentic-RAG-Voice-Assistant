<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Voice Assistant</title>
  <meta name="description" content="AI-powered voice assistant with real-time speech and text chat." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
</head>

<body>

  <!-- ── Ambient glowing arc — pure CSS, no image asset ─────── -->
  <div class="glow-arc" aria-hidden="true"></div>

  <!-- ── Frosted-glass main card ───────────────────────────── -->
  <div class="main-card" id="main-card">

    <!-- Card top-bar -->
    <div class="card-topbar">
      <div class="card-title">
        <span class="status-dot"></span>
        <span>AI Assistant</span>
        <span class="model-badge">llama-3.3-70b-versatile</span>
      </div>
      <!-- Non-functional close placeholder -->
      <button class="close-btn" id="close-btn" aria-label="Close" title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- ── Waveform visualizer ─────────────────────────────── -->
    <div class="waveform-section">
      <canvas id="waveform-canvas" class="waveform-canvas" aria-label="Audio waveform visualizer"></canvas>
      <!-- Status text: shows transcribed text or bot reply or idle hint -->
      <p class="waveform-status" id="waveform-status">Tap the mic to speak…</p>
    </div>

    <!-- ── Circular mic button ────────────────────────────── -->
    <div class="mic-section">
      <button id="mic-btn" class="mic-btn" aria-label="Record voice" title="Click to record">
        <!-- Microphone SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4z"/>
          <path d="M19 10a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V19H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 10z"/>
        </svg>
      </button>
    </div>

    <!-- ── Scrollable message list ────────────────────────── -->
    <main class="chat-messages" id="chat-messages" role="log" aria-live="polite">
      <div class="message bot">
        <div class="bubble">
          👋 Hello! How can I help you today?
        </div>
      </div>
    </main>

    <!-- ── Text input bar ─────────────────────────────────── -->
    <footer class="chat-input-bar">
      <textarea id="user-input" class="chat-input" placeholder="Type a message…" rows="1"
        aria-label="Message input"></textarea>
      <button id="send-btn" class="send-btn" aria-label="Send message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
        </svg>
      </button>
    </footer>

  </div><!-- /main-card -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
  <script src="{{ url_for('static', path='js/chat.js') }}"></script>
</body>

</html>
